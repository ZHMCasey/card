<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Casey Ma</title>
<meta name="description" content="Casey Ma, Northern California Office Director, InGenius Prep. Contact card.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #10203A;
    --ink-deep: #0B1729;
    --paper: #F3EEE4;
    --paper-dim: #A9B5C9;
    --brass: #CDB07A;
    --rule: rgba(243, 238, 228, .16);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--ink-deep);
    color: var(--paper);
    font-family: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 17px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    display: flex;
    justify-content: center;
  }
  main {
    width: 100%;
    max-width: 440px;
    min-height: 100dvh;
    background: var(--ink);
    padding: calc(env(safe-area-inset-top) + 64px) 28px calc(env(safe-area-inset-bottom) + 28px);
    display: flex;
    flex-direction: column;
  }
  .avatar {
    width: 96px; height: 96px; border-radius: 50%;
    object-fit: cover; display: block; margin: 0 0 24px;
    border: 1px solid var(--rule);
  }
  .avatar[hidden] { display: none; }
  h1 {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 500;
    font-size: clamp(44px, 12vw, 58px);
    line-height: 1;
    letter-spacing: -.01em;
    margin: 0 0 14px;
  }
  .role { font-size: 19px; font-weight: 500; margin: 0; line-height: 1.3; }
  .org { color: var(--paper-dim); font-size: 17px; margin: 4px 0 0; }
  .org:empty { display: none; }
  hr { border: 0; height: 1px; width: 40px; background: var(--brass); margin: 32px 0 26px; }
  .rows { list-style: none; margin: 0; padding: 0; }
  .rows li {
    display: flex; justify-content: space-between; gap: 16px;
    padding: 14px 0; border-bottom: 1px solid var(--rule);
  }
  .rows li:first-child { border-top: 1px solid var(--rule); }
  .rows span { color: var(--paper-dim); flex: none; }
  .rows a { color: var(--paper); text-decoration: none; text-align: right; word-break: break-all; }
  .rows a:hover { text-decoration: underline; text-underline-offset: 3px; }
  .spacer { flex: 1; min-height: 40px; }
  .save {
    display: block; text-align: center;
    background: var(--paper); color: var(--ink);
    font-weight: 500; font-size: 18px;
    padding: 18px; border-radius: 999px; text-decoration: none;
  }
  .save:active { transform: translateY(1px); }
  .book {
    display: block; text-align: center;
    background: none; color: var(--paper);
    border: 1px solid var(--brass);
    font-weight: 500; font-size: 18px;
    padding: 17px; border-radius: 999px; text-decoration: none;
    margin-bottom: 12px;
  }
  .book:active { transform: translateY(1px); }
  .rows button {
    background: none; border: 0; padding: 0; margin: 0;
    color: var(--paper); font: inherit; cursor: pointer; text-align: right;
  }
  .rows button.done { color: var(--brass); }
  .hint {
    margin: 12px 0 0; text-align: center; font-size: 14px; line-height: 1.4;
    color: var(--brass);
  }
  .hint[hidden] { display: none; }
  .foot {
    display: flex; justify-content: center; align-items: center; gap: 12px;
    margin-top: 18px; color: var(--paper-dim); font-size: 15px;
  }
  .foot button { background: none; border: 0; padding: 6px 4px; color: var(--paper-dim); font: inherit; cursor: pointer; }
  .foot button:hover { color: var(--paper); }
  .foot .dot { opacity: .5; }
  .rows .sel { color: var(--paper); user-select: all; -webkit-user-select: all; }
  #qr { display: none; margin: 16px auto 0; width: min(232px, 62vw); }
  #qr.on { display: block; }
  #qr img { display: block; width: 100%; height: auto; }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--brass); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <img class="avatar" id="avatar" alt="" hidden>
  <h1 id="name"></h1>
  <p class="role" id="role"></p>
  <p class="org" id="org"></p>
  <hr>
  <ul class="rows" id="rows"></ul>
  <div class="spacer"></div>
  <a class="book" id="book" hidden>Book a meeting</a>
  <a class="save" id="save" href="contact.vcf" download="Casey Ma.vcf">Save contact</a>
  <p class="hint" id="hint" hidden></p>
  <div class="foot">
    <button type="button" id="qrBtn" hidden>Show QR code</button>
    <span class="dot" id="dot" hidden>&middot;</span>
    <button type="button" id="shareBtn">Share</button>
  </div>
  <div id="qr"></div>
</main>

<script>
  // ===== 改这里就行 =====
  const CARD = {
    name: "Casey Ma",
    title: "Northern California Office Director",
    company: "InGenius Prep",
    email: "zihua.ma@ingeniusprep.com",
    phone: "",                // 例如 "+1 408 000 0000"
    avatar: "avatar.jpg",     // 头像文件名，不要头像就改成 ""
    wechat: "caseymaca",      // 微信号，点一下会复制
    meeting: "https://meetings.hubspot.com/casey-ma",  // 预约会议链接，做成按钮
    links: [                  // 每行一个链接
      { label: "Website", url: "https://ingeniusprep.com/" },
      // { label: "LinkedIn", url: "https://linkedin.com/in/xxx" },
    ],
  };
  // 改了电话、公司或链接后，记得同步改 contact.vcf 里对应的行
  // =======================

  document.getElementById("name").textContent = CARD.name;
  document.title = CARD.name;
  document.getElementById("role").textContent = CARD.title;
  document.getElementById("org").textContent = CARD.company;
  if (CARD.avatar) {
    const av = document.getElementById("avatar");
    av.src = CARD.avatar; av.alt = CARD.name; av.hidden = false;
  }

  const rows = [];
  if (CARD.email) rows.push({ label: "Email", text: CARD.email, href: "mailto:" + CARD.email });
  if (CARD.phone) rows.push({ label: "Phone", text: CARD.phone, href: "tel:" + CARD.phone.replace(/[^+\d]/g, "") });
  if (CARD.wechat) rows.push({ label: "WeChat", text: CARD.wechat, copy: true });
  for (const l of CARD.links) {
    rows.push({ label: l.label, text: l.url.replace(/^https?:\/\/(www\.)?/, "").replace(/\/$/, ""), href: l.url });
  }
  document.getElementById("rows").innerHTML = rows.map(r => r.copy
    ? `<li><span>${r.label}</span><button type="button" data-copy="${r.text}">${r.text}</button></li>`
    : `<li><span>${r.label}</span><a href="${r.href}">${r.text}</a></li>`
  ).join("");
  // 复制：先试剪贴板 API，再试老方法；都失败就不显示 Copied，改成可长按选中
  async function copyText(t) {
    try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(t); return true; } } catch (e) {}
    try {
      const ta = document.createElement("textarea"); ta.value = t; ta.setAttribute("readonly", "");
      ta.style.cssText = "position:fixed;top:0;left:0;opacity:0"; document.body.appendChild(ta);
      ta.select(); ta.setSelectionRange(0, t.length);
      const ok = document.execCommand("copy"); document.body.removeChild(ta); return ok;
    } catch (e) { return false; }
  }
  document.querySelectorAll("[data-copy]").forEach(b => b.addEventListener("click", async () => {
    if (await copyText(b.dataset.copy)) {
      b.textContent = "Copied"; b.classList.add("done");
      setTimeout(() => { b.textContent = b.dataset.copy; b.classList.remove("done"); }, 1500);
    } else {
      const li = b.parentElement, span = document.createElement("span");
      span.className = "sel"; span.textContent = b.dataset.copy;
      li.querySelector("span").textContent = "WeChat \u00b7 long-press to copy";
      b.replaceWith(span);
    }
  }));
  // 分享：优先系统分享面板；没有就复制链接；微信里提示用右上角菜单
  const shareBtn = document.getElementById("shareBtn");
  const inWeChat = /MicroMessenger/i.test(navigator.userAgent);
  const flash = (el, msg) => { const t = el.textContent; el.textContent = msg; setTimeout(() => { el.textContent = t; }, 2000); };
  // 微信内置浏览器存不了通讯录，引导去系统浏览器打开
  if (inWeChat) {
    document.getElementById("save").addEventListener("click", (e) => {
      e.preventDefault();
      const h = document.getElementById("hint");
      h.textContent = "\u5fae\u4fe1\u5185\u65e0\u6cd5\u5b58\u5165\u901a\u8baf\u5f55\uff1a\u8bf7\u70b9\u53f3\u4e0a\u89d2 \u00b7\u00b7\u00b7 \u9009\u201c\u5728\u6d4f\u89c8\u5668\u4e2d\u6253\u5f00\u201d";
      h.hidden = false;
    });
  }
  shareBtn.addEventListener("click", async () => {
    if (inWeChat) { flash(shareBtn, "Tap \u00b7\u00b7\u00b7 top right to share"); return; }
    const data = { title: CARD.name, text: CARD.name + " \u2014 " + CARD.title + (CARD.company ? ", " + CARD.company : ""), url: location.href };
    if (navigator.share) { try { await navigator.share(data); return; } catch (e) { if (e && e.name === "AbortError") return; } }
    flash(shareBtn, (await copyText(location.href)) ? "Link copied" : "Copy failed \u2014 copy the address bar");
  });
  if (CARD.meeting) {
    const bk = document.getElementById("book");
    bk.href = CARD.meeting; bk.hidden = false;
  }

  // 二维码：只在页面已经上线（http/https）时显示，编码的是当前页面地址
  const qrBtn = document.getElementById("qrBtn");
  if (location.protocol.startsWith("http")) {
    qrBtn.hidden = false; document.getElementById("dot").hidden = false;
    qrBtn.addEventListener("click", () => {
      const box = document.getElementById("qr");
      if (box.classList.toggle("on")) {
        qrBtn.textContent = "Hide QR code";
        if (!box.hasChildNodes()) {
          const im = document.createElement("img");
          im.src = "qr.svg"; im.alt = "QR code for this card";
          box.appendChild(im);
        }
      } else {
        qrBtn.textContent = "Show QR code";
      }
    });
  }
</script>
</body>
</html>
