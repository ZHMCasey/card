<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Casey Ma</title>
<meta name="description" content="Casey Ma, Northern California Office Director, InGenius Prep. Contact card.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #10203A;
    --ink-deep: #0B1729;
    --paper: #F3EEE4;
    --paper-dim: #A9B5C9;
    --brass: #CDB07A;
    --rule: rgba(243, 238, 228, .16);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--ink-deep);
    color: var(--paper);
    font-family: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 17px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    display: flex;
    justify-content: center;
  }
  main {
    width: 100%;
    max-width: 440px;
    min-height: 100dvh;
    background: var(--ink);
    padding: calc(env(safe-area-inset-top) + 64px) 28px calc(env(safe-area-inset-bottom) + 28px);
    display: flex;
    flex-direction: column;
  }
  .avatar {
    width: 96px; height: 96px; border-radius: 50%;
    object-fit: cover; display: block; margin: 0 0 24px;
    border: 1px solid var(--rule);
  }
  .avatar[hidden] { display: none; }
  h1 {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 500;
    font-size: clamp(44px, 12vw, 58px);
    line-height: 1;
    letter-spacing: -.01em;
    margin: 0 0 14px;
  }
  .role { font-size: 19px; font-weight: 500; margin: 0; line-height: 1.3; }
  .org { color: var(--paper-dim); font-size: 17px; margin: 4px 0 0; }
  .org:empty { display: none; }
  hr { border: 0; height: 1px; width: 40px; background: var(--brass); margin: 32px 0 26px; }
  .rows { list-style: none; margin: 0; padding: 0; }
  .rows li {
    display: flex; justify-content: space-between; gap: 16px;
    padding: 14px 0; border-bottom: 1px solid var(--rule);
  }
  .rows li:first-child { border-top: 1px solid var(--rule); }
  .rows span { color: var(--paper-dim); flex: none; }
  .rows a { color: var(--paper); text-decoration: none; text-align: right; word-break: break-all; }
  .rows a:hover { text-decoration: underline; text-underline-offset: 3px; }
  .spacer { flex: 1; min-height: 40px; }
  .save {
    display: block; text-align: center;
    background: var(--paper); color: var(--ink);
    font-weight: 500; font-size: 18px;
    padding: 18px; border-radius: 999px; text-decoration: none;
  }
  .save:active { transform: translateY(1px); }
  .book {
    display: block; text-align: center;
    background: none; color: var(--paper);
    border: 1px solid var(--brass);
    font-weight: 500; font-size: 18px;
    padding: 17px; border-radius: 999px; text-decoration: none;
    margin-bottom: 12px;
  }
  .book:active { transform: translateY(1px); }
  .rows button {
    background: none; border: 0; padding: 0; margin: 0;
    color: var(--paper); font: inherit; cursor: pointer; text-align: right;
  }
  .rows button.done { color: var(--brass); }
  .qr-toggle {
    margin: 18px auto 0; padding: 6px 10px;
    background: none; border: 0; color: var(--paper-dim);
    font: inherit; font-size: 15px; cursor: pointer;
  }
  #qr { display: none; margin: 14px auto 0; padding: 12px; background: #fff; border-radius: 12px; width: max-content; }
  #qr.on { display: block; }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--brass); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <img class="avatar" id="avatar" alt="" hidden>
  <h1 id="name"></h1>
  <p class="role" id="role"></p>
  <p class="org" id="org"></p>
  <hr>
  <ul class="rows" id="rows"></ul>
  <div class="spacer"></div>
  <a class="book" id="book" hidden>Book a meeting</a>
  <a class="save" href="contact.vcf">Save contact</a>
  <button class="qr-toggle" id="qrBtn" hidden>Show QR code</button>
  <div id="qr"></div>
</main>

<script>
  // ===== 改这里就行 =====
  const CARD = {
    name: "Casey Ma",
    title: "Northern California Office Director",
    company: "InGenius Prep",
    email: "zihua.ma@ingeniusprep.com",
    phone: "",                // 例如 "+1 408 000 0000"
    avatar: "avatar.jpg",     // 头像文件名，不要头像就改成 ""
    wechat: "caseymaca",      // 微信号，点一下会复制
    meeting: "https://meetings.hubspot.com/casey-ma",  // 预约会议链接，做成按钮
    links: [                  // 每行一个链接
      { label: "Website", url: "https://ingeniusprep.com/" },
      // { label: "LinkedIn", url: "https://linkedin.com/in/xxx" },
    ],
  };
  // 改了电话、公司或链接后，记得同步改 contact.vcf 里对应的行
  // =======================

  document.getElementById("name").textContent = CARD.name;
  document.title = CARD.name;
  document.getElementById("role").textContent = CARD.title;
  document.getElementById("org").textContent = CARD.company;
  if (CARD.avatar) {
    const av = document.getElementById("avatar");
    av.src = CARD.avatar; av.alt = CARD.name; av.hidden = false;
  }

  const rows = [];
  if (CARD.email) rows.push({ label: "Email", text: CARD.email, href: "mailto:" + CARD.email });
  if (CARD.phone) rows.push({ label: "Phone", text: CARD.phone, href: "tel:" + CARD.phone.replace(/[^+\d]/g, "") });
  if (CARD.wechat) rows.push({ label: "WeChat", text: CARD.wechat, copy: true });
  for (const l of CARD.links) {
    rows.push({ label: l.label, text: l.url.replace(/^https?:\/\/(www\.)?/, "").replace(/\/$/, ""), href: l.url });
  }
  document.getElementById("rows").innerHTML = rows.map(r => r.copy
    ? `<li><span>${r.label}</span><button type="button" data-copy="${r.text}">${r.text}</button></li>`
    : `<li><span>${r.label}</span><a href="${r.href}">${r.text}</a></li>`
  ).join("");
  document.querySelectorAll("[data-copy]").forEach(b => b.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(b.dataset.copy); } catch (e) {}
    b.textContent = "Copied"; b.classList.add("done");
    setTimeout(() => { b.textContent = b.dataset.copy; b.classList.remove("done"); }, 1500);
  }));
  if (CARD.meeting) {
    const bk = document.getElementById("book");
    bk.href = CARD.meeting; bk.hidden = false;
  }

  // 二维码：只在页面已经上线（http/https）时显示，编码的是当前页面地址
  const qrBtn = document.getElementById("qrBtn");
  if (location.protocol.startsWith("http")) {
    qrBtn.hidden = false;
    qrBtn.addEventListener("click", () => {
      const box = document.getElementById("qr");
      if (box.classList.toggle("on")) {
        qrBtn.textContent = "Hide QR code";
        if (!box.hasChildNodes()) {
          const s = document.createElement("script");
          s.src = "https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js";
          s.onload = () => new QRCode(box, { text: location.href, width: 168, height: 168, correctLevel: QRCode.CorrectLevel.M });
          document.body.appendChild(s);
        }
      } else {
        qrBtn.textContent = "Show QR code";
      }
    });
  }
</script>
</body>
</html>
